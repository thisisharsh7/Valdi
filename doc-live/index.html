<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Valdi Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Valdi - A modern framework for building cross-platform mobile applications">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="_media/favicon.png" type="image/png">

  <!-- Docsify Theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    :root {
      /* Valdi Brand Colors - Yellow Theme */
      --theme-color: #FFFC00;
      --theme-color-dark: #E6E300;
      --theme-color-light: #FFFD4D;
    }

    /* Sidebar Styling */
    .sidebar {
      background: #FFFFFF !important;
      border-right: 1px solid #E0E0E0 !important;
    }

    .sidebar .app-name {
      margin: 0 !important;
      padding: 16px 20px !important;
    }

    .sidebar .app-name-link {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
      text-decoration: none !important;
    }

    .sidebar .app-name img {
      width: 48px !important;
      height: 48px !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
    }

    .sidebar .app-name-text {
      font-size: 24px !important;
      font-weight: 700 !important;
      color: #1a1a2e !important;
    }

    /* Sidebar Navigation */
    .sidebar-nav>ul>li>a {
      display: flex !important;
      align-items: center !important;
      font-weight: 500;
      font-size: 14px;
      color: #5a5a6e !important;
      transition: all 0.2s ease !important;
      border-left: 3px solid transparent !important;
      padding-left: 12px !important;
      line-height: 1.5 !important;
    }

    .sidebar-nav>ul>li>a:hover {
      color: #2C3E50 !important;
      background: rgba(255, 252, 0, 0.05) !important;
    }

    .sidebar-nav li.active>a {
      display: flex !important;
      align-items: center !important;
      color: #1a1a2e !important;
      font-weight: 600 !important;
      border-left: 3px solid var(--theme-color) !important;
      background: rgba(255, 252, 0, 0.08) !important;
      padding-left: 12px !important;
      line-height: 1.5 !important;
    }

    /* Icons in Sidebar Navigation */
    .sidebar-nav a svg,
    .sidebar-nav a img,
    .sidebar-nav a [class*="icon"] {
      margin-right: 8px !important;
      vertical-align: middle !important;
    }

    /* Section Headers in Sidebar */
    .sidebar-nav>ul>li>strong {
      font-size: 11px !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
      color: #7a7a98 !important;
      display: block !important;
      margin: 24px 0 8px 0 !important;
      padding: 0 12px !important;
    }

    .sidebar-nav p strong {
      padding-left: 12px !important;
    }

    /* Hamburger Button */
    .sidebar-toggle {
      position: fixed !important;
      top: 8px !important;
      left: 8px !important;
      z-index: 10000 !important;
      background: var(--theme-color) !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 8px 10px !important;
      color: #000000 !important;
      box-shadow: 0 4px 12px rgba(255, 252, 0, 0.4) !important;
      transition: all 0.2s ease-in-out !important;

      height: 36px !important;
      width: auto !important;
    }

    .sidebar-toggle:hover {
      background: var(--theme-color-dark) !important;
      opacity: 1 !important;
    }

    /* Hide hamburger on desktop - sidebar always visible */
    @media screen and (min-width: 769px) {
      .sidebar-toggle {
        display: none !important;
      }

      body.close .sidebar {
        transform: translateX(0) !important;
      }
    }

    /* 📱 Overlay sidebar only on mobile + tablet */
    @media screen and (max-width: 768px) {
      .sidebar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        height: 100vh !important;
        width: 260px !important;
        /* adjust width if needed */
        background: #ffffff !important;
        z-index: 9999 !important;
        transform: translateX(-100%) !important;
        transition: transform 0.3s ease-in-out !important;
        box-shadow: 4px 0 16px rgba(0, 0, 0, 0.1) !important;
      }

      /* when sidebar is open */
      body:not(.close) .sidebar {
        transform: translateX(0) !important;
      }


      /* when sidebar is open */
      body:not(.close) .sidebar-toggle {
        top: 98px !important;
        left: 200px !important;
        transform: scale(0.95) !important;
        box-shadow: 0 2px 8px rgba(255, 252, 0, 0.3) !important;
      }




      /* keep main content still */
      .content,
      .markdown-section {
        position: relative !important;
        transform: none !important;
        transition: none !important;
        z-index: 1 !important;
      }
    }


    /* Search */
    .search input {
      border: 1px solid #E0E0E0 !important;
      border-radius: 12px !important;
      padding: 10px 16px !important;
    }

    .search input:focus {
      border-color: var(--theme-color) !important;
      box-shadow: 0 0 0 3px rgba(255, 252, 0, 0.15) !important;
    }

    /* Prevent horizontal scrollbar in search */
    .search {
      overflow-x: hidden !important;
    }

    .search .results-panel {
      overflow-x: hidden !important;
    }

    /* Clear Button Styling */
    .search .clear-button {
      width: 32px !important;
      height: 24px !important;
      display: none !important;
      align-items: center !important;
      justify-content: center !important;
      cursor: pointer !important;
      border-radius: 9em !important;
      transition: all 0.2s ease !important;
      background: var(--theme-color) !important;
      position: relative !important;
      opacity: 0 !important;
      transform: scale(0.8) !important;
      margin-left: 0.5em;
    }

    /* Show clear button only when there's text */
    .search .clear-button.show {
      display: flex !important;
      opacity: 1 !important;
      transform: scale(1) !important;
    }

    .search .clear-button:hover {
      background: var(--theme-color-dark) !important;
      transform: rotate(90deg) scale(1.05) !important;
    }

    /* Hide default SVG */
    .search .clear-button svg {
      display: none !important;
    }

    /* Create custom X icon with pseudo-elements */
    .search .clear-button::before,
    .search .clear-button::after {
      content: '' !important;
      position: absolute !important;
      width: 10px !important;
      height: 2px !important;
      background: #000000 !important;
      border-radius: 2px !important;
    }

    .search .clear-button::before {
      transform: rotate(45deg) !important;
    }

    .search .clear-button::after {
      transform: rotate(-45deg) !important;
    }

    /* Search Results Styling */
    .search .results-panel .matching-post {
      border-bottom: 1px solid #E0E0E0 !important;
      transition: background 0.2s ease !important;
    }

    .search .results-panel .matching-post:hover {
      background: rgba(255, 252, 0, 0.08) !important;
    }

    /* Highlighted search keywords - use background instead of text color */
    .search .results-panel em,
    .search .results-panel .search-keyword {
      color: #000000 !important;
      background: rgba(255, 252, 0, 0.3) !important;
      padding: 2px 4px !important;
      border-radius: 3px !important;
      font-style: normal !important;
      font-weight: 600 !important;
    }

    /* Search Result Link Colors - prevent yellow text on hover */
    .search .results-panel .matching-post a {
      color: #2C3E50 !important;
      font-weight: 500 !important;
      text-decoration: none !important;
    }

    .search .results-panel .matching-post a:hover {
      color: #1a1a2e !important;
    }

    /* Code Blocks */
    pre[data-lang] {
      border-radius: 12px !important;
      border: 1px solid #E0E0E0 !important;
    }

    code {
      background: #F8F8F8 !important;
      color: #000000 !important;
      border-radius: 4px !important;
      padding: 2px 6px !important;
      border: 1px solid #E0E0E0 !important;
      font-weight: 500 !important;
    }

    pre code {
      background: transparent !important;
      color: inherit !important;
      border: none !important;
    }

    pre .token.string,
    .token.template-string {
      color: darkgoldenrod !important;
      /* Use Valdi yellow for strings */
    }

    /* Links */
    .markdown-section a {
      color: #2C3E50 !important;
      font-weight: 500;
      text-decoration: none !important;
      border-bottom: 2px solid var(--theme-color) !important;
      transition: all 0.2s ease !important;
      padding-bottom: 2px !important;
    }

    .markdown-section a:hover {
      color: #1a1a2e !important;
      border-bottom: 3px solid var(--theme-color) !important;
      padding-bottom: 1px !important;
    }

    /* Callouts */
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color) !important;
      background: rgba(255, 252, 0, 0.08) !important;
      padding: 16px 24px !important;
      border-radius: 8px !important;
    }

    /* Copy Code Button */
    .docsify-copy-code-button {
      background: var(--theme-color) !important;
      color: #000000 !important;
      border-radius: 6px !important;
      font-weight: 600 !important;
    }

    .docsify-copy-code-button:hover {
      background: var(--theme-color-dark) !important;
    }

    /* GitHub Icon */
    .github-corner {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 10000;
      border: 0;
      color: #000000;
      fill: var(--theme-color);
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .github-corner svg {
      filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.8));
    }

    .github-corner .octo-arm,
    .github-corner .octo-body {
      stroke: #000000;
      stroke-width: 2;
    }

    .github-corner:hover {
      fill: var(--theme-color-dark);
    }

    .github-corner:hover .octo-arm {
      animation: octocat-wave 560ms ease-in-out;
    }

    @keyframes octocat-wave {

      0%,
      100% {
        transform: rotate(0);
      }

      20%,
      60% {
        transform: rotate(-25deg);
      }

      40%,
      80% {
        transform: rotate(10deg);
      }
    }

    @media screen and (max-width: 768px) {
      .github-corner {
        z-index: 10001 !important;
        pointer-events: auto !important;
        visibility: visible !important;
        display: block !important;
      }

      .github-corner svg {
        width: 60px;
        height: 60px;
      }

      /* Hide hamburger when searching */
      body.searching .sidebar-toggle {
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.2s ease !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">Loading Valdi Documentation...</div>

  <script>

    // Docsify Configuration
    window.$docsify = {
      name: 'Valdi',
      loadSidebar: true,
      autoHeader: true,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      homepage: 'README.md',
      logo: '_media/icon.png',

      // Search
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6,
        hideOtherSidebarContent: true,
      },

      // Copy Code
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },

      // Pagination
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },

      // External links
      externalLinkTarget: '_blank',

      // Markdown
      markdown: {
        smartypants: true,
        breaks: true,
      },

      // Plugins
      plugins: [
        function (hook, vm) {
          hook.mounted(function () {
            // Custom logo rendering
            const appNameEl = document.querySelector('.app-name');
            if (appNameEl) {
              appNameEl.innerHTML = `
                <a href="#/" class="app-name-link">
                  <img src="_media/icon.png" alt="Valdi Logo">
                  <span class="app-name-text">Valdi</span>
                </a>
              `;
            }

            // Style hamburger button
            const toggleButton = document.querySelector('.sidebar-toggle');
            if (toggleButton) {
              toggleButton.innerHTML = '<svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>';
            }

            // Add GitHub corner icon
            const githubCorner = document.createElement('a');
            githubCorner.href = 'https://github.com/Snapchat/Valdi';
            githubCorner.className = 'github-corner';
            githubCorner.setAttribute('aria-label', 'View source on GitHub');
            githubCorner.setAttribute('target', '_blank');
            githubCorner.innerHTML = `
              <svg width="80" height="80" viewBox="0 0 250 250" style="position: absolute; top: 0; right: 0;" aria-hidden="true">
                <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
                <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
                <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
              </svg>
            `;
            document.body.appendChild(githubCorner);

            // Mobile search UX improvements
            const searchInput = document.querySelector('.search input[type="search"]');
            if (searchInput) {
              // Hide hamburger when searching on mobile
              searchInput.addEventListener('input', function () {
                if (this.value.trim() !== '') {
                  document.body.classList.add('searching');
                } else {
                  document.body.classList.remove('searching');
                }
              });
            }

            // Show hamburger when clear button is clicked
            const clearButton = document.querySelector('.search .clear-button');
            if (clearButton) {
              clearButton.addEventListener('click', function () {
                document.body.classList.remove('searching');
              });
            }

            // Close sidebar when clicking search result on mobile
            const isMobile = () => window.innerWidth <= 768;
            document.addEventListener('click', function (e) {
              if (isMobile() && e.target.closest('.search .results-panel .matching-post a')) {
                // Close sidebar by adding 'close' class to body
                document.body.classList.add('close');
                // Clear search input
                const searchInput = document.querySelector('.search input[type="search"]');
                if (searchInput) {
                  searchInput.value = '';
                  searchInput.dispatchEvent(new Event('input'));
                }
                // Remove searching class
                document.body.classList.remove('searching');
              }
            });

            // Clear search when closing sidebar manually on mobile
            const sidebarToggle = document.querySelector('.sidebar-toggle');
            if (sidebarToggle) {
              sidebarToggle.addEventListener('click', function () {
                if (isMobile()) {
                  // If sidebar is open (about to close), clear search
                  if (!document.body.classList.contains('close')) {
                    const searchInput = document.querySelector('.search input[type="search"]');
                    if (searchInput && searchInput.value.trim() !== '') {
                      searchInput.value = '';
                      searchInput.dispatchEvent(new Event('input'));
                      document.body.classList.remove('searching');
                    }
                  }
                }
              });
            }
          });

          hook.doneEach(function () {
            // Enhanced callouts
            const blockquotes = document.querySelectorAll('.markdown-section blockquote');
            blockquotes.forEach(bq => {
              const text = bq.textContent;
              if (text.includes('[!NOTE]') || text.includes('[!Note]')) {
                bq.style.borderLeftColor = '#FFFC00';
                bq.style.background = 'rgba(255, 252, 0, 0.08)';
              } else if (text.includes('[!IMPORTANT]') || text.includes('[!Important]')) {
                bq.style.borderLeftColor = '#E6E300';
                bq.style.background = 'rgba(230, 227, 0, 0.08)';
              } else if (text.includes('[!WARNING]') || text.includes('[!Warning]')) {
                bq.style.borderLeftColor = '#F59E0B';
                bq.style.background = 'rgba(245, 158, 11, 0.08)';
              }
            });
          });
        }
      ],

      fallbackLanguages: ['tsx', 'typescript', 'javascript', 'kotlin', 'swift', 'objectivec'],
      emoji: true,
    }
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/emoji.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>

  <!-- Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-jsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-kotlin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-swift.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-objectivec.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>

</html>
